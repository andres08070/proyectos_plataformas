<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" href="/CSS/style_registro.css">
  <link rel="icon" href="/IMGS/logo didamartials.png" type="image/x-icon">
  <title>DIDA MARTIALS | Registro</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <!-- Carrusel de fondo -->
 <div class="fondo">
    <div id="fondoCarrusel" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="4000">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="/IMGS/fondoImg1.jpg" alt="Fondo 1">
        </div>
        <div class="carousel-item">
          <img src="/IMGS/fondoImg2.jpg" alt="Fondo 2">
        </div>
        <div class="carousel-item">
          <img src="/IMGS/fondoImg3.jpg" alt="Fondo 3">
        </div>
      </div>
    </div>
  </div>

  <!-- Sección principal -->
  <section class="principal">
    <div class="formulario">
      <div class="img_header">
        <a href="index.html">
          <img src="/IMGS/logo didamartials NEGRO.png" width="120" alt="Logo DidaMartials">
        </a>
      </div>

      <h1 class="club_nosotros">Crea una cuenta</h1>

      <form id="loginform" action="/registrar" method="post">
        <input type="email" id="email" name="email" class="input" placeholder="Correo electrónico" required>
        <input type="text" id="nombre" name="nombre" class="input" placeholder="Nombre de usuario" required>
        <input type="password" id="contraseña" name="contraseña" class="input" placeholder="Contraseña" required>
        <input type="password" id="repetir_contraseña" name="repetir_contraseña" class="input" placeholder="Repetir contraseña" required>
        <button type="submit">Crear cuenta</button>
      </form>

      <p class="pregunta">¿Ya tienes cuenta?</p>
      <a class="text-links" href="/HTML/InicioSesion.html" id="Registrar">Inicia sesión</a>
    </div>
  </section>

  <!-- Alerta personalizada -->
  <div id="customAlert">
    <p id="alertMessage"></p>
    <button id="cerrar" onclick="closeAlert()">Cerrar</button>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/registro-alerta.js"></script>
</body>
</html>
