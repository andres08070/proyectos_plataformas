<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" href="/CSS/style_inicio_sesion.css">
  <link rel="icon" href="/IMGS/logo didamartials.png" type="image/x-icon">
  <title>DIDA MARTIALS | Inicio de sesión</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <!-- Carrusel de fondo -->
  <div class="fondo">
    <div id="fondoCarrusel" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="4000">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="/IMGS/fondoImg1.jpg" alt="Fondo 1">
        </div>
        <div class="carousel-item">
          <img src="/IMGS/fondoImg2.jpg" alt="Fondo 2">
        </div>
        <div class="carousel-item">
          <img src="/IMGS/fondoImg3.jpg" alt="Fondo 3">
        </div>
      </div>
    </div>
  </div>

  <!-- Sección principal -->
  <section class="principal">
    <div class="formulario">
      <a class="img_header" href="index.html"><img src="/IMGS/logo didamartials NEGRO.png" width="120"></a>
      <h2 class="club_nosotros">Inicio de Sesión</h2>

      <form id="loginform" action="/validar" method="post">
        <input type="email" id="email" name="email" class="input" placeholder="Ingrese su correo" required>
        <input type="password" id="password" name="password" class="input" placeholder="Ingrese su contraseña" required>
        <button type="submit">Ingresar</button>
      </form>

      <p class="pregunta">¿No tienes una cuenta?</p>
      <a class="text-links" href="registro.html">Regístrate</a>
    </div>
  </section>

  <!-- Alerta personalizada -->
  <div id="customAlert">
    <p id="alertMessage">Contraseña o correo incorrecto</p>
    <button id="cerrar" onclick="closeAlert()">Cerrar</button>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/inicio-alerta.js"></script>
</body>
</html>
