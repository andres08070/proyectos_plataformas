<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Buscar Estudiante</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <div class="container">
        <h1>Buscar Estudiante por ID</h1>

        <form action="/buscar" method="get" class="form-standard">
            <div class="form-group">
                <label for="id">Ingresa la ID:</label>
                <input type="number" id="id" name="id" required>
            </div>
            <button type="submit" class="button-primary">Buscar</button>
        </form>

        <div th:if="${resultado != null}" class="result-box">
            <h3>Resultado:</h3>
            <p><strong>ID:</strong> <span th:text="${resultado.id}"></span></p>
            <p><strong>Nombre:</strong> <span th:text="${resultado.nombre}"></span></p>
            <p><strong>Edad:</strong> <span th:text="${resultado.edad}"></span></p>
        </div>

        <div th:if="${mensaje}" class="message">
            <p th:text="${mensaje}"></p>
        </div>

        <a href="/" class="back-link">Volver</a>
    </div>
</body>
</html>
