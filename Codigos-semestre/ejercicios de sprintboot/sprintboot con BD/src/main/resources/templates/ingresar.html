<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html>
    <head>
        <title>Ingresar Estudiante</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="global.css">
    </head>
    <body>
        <div class="container">
            <h1>Ingresar Estudiante Nuevo</h1>
            <form action="/añadir" method="post" class="form-standard">
                <div class="form-group">
                    <label for="id">Ingresa la ID:</label>
                    <input type="number" id="id" name="id" required>
                </div>
                
                <div class="form-group">
                    <label for="nombre">Ingresa el Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                
                <div class="form-group">
                    <label for="edad">Ingresa la Edad:</label>
                    <input type="number" id="edad" name="edad" required>
                </div>
                
                <button type="submit" class="button-primary">Ingresar</button>
            </form>
            <p th:text="${mensaje}" class="message"></p>
            <a href="/" class="back-link">Volver a las opciones</a>
        </div>
    </body>
</html>
