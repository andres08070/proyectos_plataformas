<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Actualizar Estudiante</title>
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <div class="container">
        <h1>Actualizar Datos del Estudiante</h1>

        <form action="/actualizar" method="post" class="form-standard">
            <input type="hidden" name="_method" value="put">
            
            <div class="form-group">
                <label for="id">ID:</label>
                <input type="number" id="id" name="id" required>
            </div>

            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" required>
            </div>

            <button type="submit" class="button-primary">Actualizar</button>
        </form>

        <p th:text="${mensaje}" class="message"></p>
        <a href="/" class="back-link">Volver a las opciones</a>
    </div>
</body>
</html>
