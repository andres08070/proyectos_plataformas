<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Estudiantes</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <div class="container">
        <h1>Lista Completa de Estudiantes</h1>

        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Edad</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="estu : ${lista}">
                    <td th:text="${estu.id}"></td>
                    <td th:text="${estu.nombre}"></td>
                    <td th:text="${estu.edad}"></td>
                </tr>
            </tbody>
        </table>

        <a href="/" class="back-link">Volver a las opciones</a>
    </div>
</body>
</html>
