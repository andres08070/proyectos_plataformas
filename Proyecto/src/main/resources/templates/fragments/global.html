<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo, archivoCss)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Didamartials</title>
    
    <link rel="icon" type="image/x-icon" th:href="@{/imgs/logoicon.ico}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" th:href="@{${archivoCss}}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <footer th:fragment="footer_public" class="cta-footer">
        <div class="content-wrapper">
            <p class="cta-text">¿Listo para organizar tu próximo campeonato?</p>
            <p class="cta-slogan">
                Únete a Didamartials y simplifica la gestión de tus torneos de artes marciales
            </p>

            <div class="cta-buttons">
                <a th:href="@{/registro}" class="btn-cta btn-white-border">Comenzar Ahora</a>
                <a th:href="@{/login}" class="btn-cta btn-red-filled">Ya tengo cuenta</a>
            </div>
        </div>

        <div class="footer-copyright">
            © 2025 Didamartials - Sistema de gestión de campeonatos de artes marciales
        </div>
    </footer>

</body>
</html>
