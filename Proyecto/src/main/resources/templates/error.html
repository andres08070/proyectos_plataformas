<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <head th:replace="~{fragments/global :: head(titulo='¡Ups! Algo salió mal', archivoCss='/styles.css')}"></head>
    
    <style>
        .error-content {
            text-align: center;
        }
        
        .error-code {
            font-family: 'Montserrat', sans-serif;
            font-size: 8rem; /* Gigante */
            font-weight: 800;
            line-height: 1;
            color: var(--color-acento); /* Rojo Dida */
            margin: 0;
            /* Animación de "Golpe" */
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
            transform: translate3d(0, 0, 0);
        }
        
        .error-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            color: var(--color-principal);
            font-weight: 700;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .error-message {
            color: var(--color-texto);
            margin: 15px auto 30px;
            max-width: 400px;
        }

        .icon-broken {
            font-size: 4rem;
            color: #333;
            margin-bottom: 20px;
            opacity: 0.2;
        }

        /* Animación de impacto */
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <header class="header">
            <img th:src="@{/imgs/logo2.png}" alt="Logo Didamartials" class="logo-img">
        </header>

        <div class="error-content">
            
            <div class="icon-broken">
                <i class="fas fa-unlink"></i>
            </div>

            <h1 class="error-code" th:text="${status} ?: 'UPS'">404</h1>

            <h2 class="error-title">Movimiento Inválido</h2>

            <p class="error-message" th:if="${status == 404}">
                Parece que la página o el recurso que buscas no existe o ha sido movido del tatami.
            </p>
            <p class="error-message" th:unless="${status == 404}">
                Hemos tenido un problema técnico interno. Nuestros cinturones negros ya lo están revisando.
            </p>

            <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                <a href="javascript:history.back()" class="btn-submit" style="margin-top: 0; padding: 12px 30px; width: auto; background-color: transparent; border: 2px solid #ccc; color: #555;">
                    Regresar
                </a>
            </div>
            
        </div>
    </div>

</body>
</html>
