<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/global :: head(titulo='Didamartials - Iniciar Sesión', archivoCss='/css/styles.css')}">
</head>

<body>

    <div class="container">
        <a th:href="@{/}" class="btn-back" title="Volver al inicio">
            <i class="fas fa-arrow-left fa-2x"></i>
        </a>
        
        <div th:if="${param.logout != null}" class="alert alert-info">
            <i class="fas fa-check-circle"></i>
            <p>Sesión cerrada exitosamente.</p>
        </div>

        <header class="header">
            <a th:href="@{/}" title="Ir a la página principal">
                <img th:src="@{/imgs/logo2.png}" alt="Logo Didamartials" class="logo-img">
            </a>

            <h2>Iniciar Sesión</h2>
        </header>

        <form action="/iniciarSesion" method="post" id="formularioLogin">
            
            <div class="form-group">
                <label>Correo Electrónico:</label>
                <input type="email" 
                       name="correo" 
                       required 
                       placeholder="Ingresa tu correo registrado">
            </div>
            
            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" 
                       name="contraseña" 
                       required 
                       placeholder="Ingresa tu contraseña">
            </div>

            <button type="submit" class="btn-submit">Ingresar</button>

            <div style="text-align: center; margin-top: 15px;">
                <p>¿Aún no tienes una cuenta? 
                    <a th:href="@{/registro}" style="color: var(--color-acento); text-decoration: none; font-weight: bold;">Regístrarse</a>
                </p>
            </div>
        </form>
        
        <p th:text="${msg}" style="color: var(--color-alerta); margin-top: 10px; text-align: center; "></p>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Efecto de focus en inputs
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.classList.add('focused');
                });
                input.addEventListener('blur', function() {
                    if (this.value === '') {
                        this.parentElement.classList.remove('focused');
                    }
                });
            });

            // Mostrar/ocultar contraseña (opcional, podrías añadir un icono)
            // Si quieres añadir un ojo para mostrar contraseña, puedes hacerlo aquí
        });
    </script>
</body>
</html>
