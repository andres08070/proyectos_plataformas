<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Gestión de Inscripciones - ' + ${nombreCampeonato}">Gestión de Inscripciones</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-family: Arial, sans-serif; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f2f2f2; }
        .aceptar { background-color: #4CAF50; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
        .rechazar { background-color: #f44336; color: white; border: none; padding: 8px 12px; margin-left: 5px; cursor: pointer; border-radius: 4px; }
        .mensaje-exito { color: green; font-weight: bold; margin-bottom: 15px; }
        .mensaje-error { color: red; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h1 th:text="'Gestión de Inscripciones Pendientes: ' + ${nombreCampeonato}">Gestión de Inscripciones Pendientes</h1>
    
    <div th:if="${successMsg}" class="mensaje-exito" th:text="${successMsg}"></div>
    <div th:if="${errorMsg}" class="mensaje-error" th:text="${errorMsg}"></div>

    <div th:if="${inscripciones.isEmpty()}">
        <p>🎉 ¡No hay inscripciones pendientes en este momento!</p>
    </div>

    <table th:unless="${inscripciones.isEmpty()}">
        <thead>
            <tr>
                <th>ID Insc.</th>
                <th>Participante</th>
                <th>Edad/Sexo</th>
                <th>Cinturón/Rango</th>
                <th>Modalidad</th> 
                <th>Fecha Insc.</th> <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="inscripcion : ${inscripciones}">
                <td th:text="${inscripcion.idInscripcion}">125</td>
                <td th:text="${inscripcion.nombreParticipante}">Juan Pérez</td>
                <td>
                    <span th:text="${inscripcion.edad}">25</span> / <span th:text="${inscripcion.sexo}">M</span>
                </td>
                <td th:text="${inscripcion.cinturonRango}">Negro</td>
                
                <td th:text="${inscripcion.nombreModalidad}">Kumite</td> 
                
                <td th:text="${#temporals.format(inscripcion.fechaInscripcion, 'dd-MM-yyyy HH:mm')}">14/12/2025</td>
                
                <td>
                    <form th:action="@{/campeonato/inscripciones/procesar}" method="post" style="display: inline;">
                        <input type="hidden" name="id_inscripcion" th:value="${inscripcion.idInscripcion}" />
                        <input type="hidden" name="id_campeonato" th:value="${idCampeonato}" />
                        <input type="hidden" name="accion" value="aceptar" />
                        <button type="submit" class="aceptar">Aceptar</button>
                    </form>
                    
                    <form th:action="@{/campeonato/inscripciones/procesar}" method="post" style="display: inline;">
                        <input type="hidden" name="id_inscripcion" th:value="${inscripcion.idInscripcion}" />
                        <input type="hidden" name="id_campeonato" th:value="${idCampeonato}" />
                        <input type="hidden" name="accion" value="rechazar" />
                        <button type="submit" class="rechazar">Rechazar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
