<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle e Inscripción al Campeonato</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .campeonato-header { background-color: #f0f0f0; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .modalidad-card { border: 1px solid #ccc; padding: 15px; margin-top: 15px; border-radius: 6px; }
        .modalidad-card h3 { color: #0056b3; margin-top: 0; }
        .data-item { margin-bottom: 5px; }
        .data-item strong { display: inline-block; width: 100px; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div th:if="${mensajeExito}" class="alert-success">
        <p th:text="${mensajeExito}"></p>
    </div>
    <div th:if="${mensajeError}" class="alert-error">
        <p th:text="${mensajeError}"></p>
    </div>
    
    <div class="campeonato-header">
        <h1>Inscripción: <span th:text="${campeonato.nombre}">[Nombre Campeonato]</span></h1>
        <p><strong>Ubicación:</strong> <span th:text="${campeonato.ubicacion}">[Ubicación]</span></p>
        <p><strong>Organizador:</strong> <span th:text="${campeonato.nombreCreador}">[Creador]</span></p>
    </div>

    <h2>Modalidades Disponibles</h2>
    
    <div th:if="${modalidades.isEmpty()}" style="color: red;">
        <p>No hay modalidades activas o con detalles registrados para este campeonato.</p>
    </div>
    
    <div th:each="modalidad : ${modalidades}" class="modalidad-card">
        
        <div th:each="entry : ${modalidad}" class="data-item">
            <th:block th:if="${entry.key != 'idModalidad'}">
                <strong><span th:text="${entry.key}">[Clave]</span>:</strong> 
                <span th:text="${entry.value}">[Valor]</span>
            </th:block>
        </div>
        
        <form th:action="@{/inscripciones/inscribir}" method="post" style="margin-top: 15px;">
            
            <input type="hidden" name="idCampeonato" th:value="${campeonato.id}" />
            
            <input type="hidden" name="idModalidad" th:value="${modalidad.get('idModalidad')}" />
            
            <input type="hidden" name="idUsuario" th:value="123456" /> 
            
            <button type="submit" style="background-color: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer;">
                Inscribirse en esta modalidad
            </button>
        </form>
    </div>

</body>
</html>
