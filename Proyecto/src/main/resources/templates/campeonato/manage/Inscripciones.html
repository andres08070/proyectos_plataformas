<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inscripción al Campeonato</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" th:href="@{/css/inscripciones.css}">
</head>
<body class="bg-light">

<div class="container py-5">
    
    <div class="text-center mb-5 header-animate">
        <h2 class="fw-bold text-uppercase">Inscripción Oficial</h2>
        <h4 class="text-primary" th:text="${campeonato.nombre}">Nombre del Torneo</h4>
        <p class="text-muted" th:if="${campeonato.descripcion != null}" th:text="${campeonato.descripcion}">Descripción del evento</p>
    </div>

    <div class="row justify-content-center mb-4">
        <div class="col-md-5 mb-3">
            <div class="card p-4 text-center role-card" id="card-competidor" onclick="gestionarInscripcion.seleccionarRol('competidor')">
                <div class="card-body">
                    <div class="icon-circle bg-primary-subtle text-primary mb-3">
                        <i class="fas fa-user-ninja fa-2x"></i>
                    </div>
                    <h4>Soy Competidor</h4>
                    <p class="text-muted small mb-0">Participar en Combate o Formas</p>
                </div>
            </div>
        </div>
        
        <div class="col-md-5 mb-3">
            <div class="card p-4 text-center role-card" id="card-juez" onclick="gestionarInscripcion.seleccionarRol('juez')">
                <div class="card-body">
                    <div class="icon-circle bg-danger-subtle text-danger mb-3">
                        <i class="fas fa-gavel fa-2x"></i>
                    </div>
                    <h4>Soy Juez</h4>
                    <p class="text-muted small mb-0">Arbitraje y Puntuación</p>
                </div>
            </div>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-9">
            
            <div id="form-competidor" class="card shadow-lg border-0 form-section" style="display: none;">
                <div class="card-header bg-primary text-white py-3">
                    <h5 class="mb-0"><i class="fas fa-fist-raised me-2"></i>Ficha de Competidor</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/inscripciones/guardar/competidor}" method="post">
                        
                        <input type="hidden" name="idCampeonato" th:value="${campeonato.id}">

                        <h6 class="text-uppercase text-muted mb-3 small fw-bold">1. Información Personal</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Cédula / Documento <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" name="documento" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Nombre Completo <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" name="nombre" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Correo Electrónico <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" name="correo" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Sexo <span class="text-danger">*</span></label>
                                <select class="form-select" name="sexo" required>
                                    <option value="" selected disabled>Seleccionar...</option>
                                    <option value="Masculino">Masculino</option>
                                    <option value="Femenino">Femenino</option>
                                </select>
                            </div>
                        </div>

                        <h6 class="text-uppercase text-muted mb-3 small fw-bold">2. Datos Técnicos</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label class="form-label">Edad <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" name="edad" required min="4" max="99">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Peso (Kg) <span class="text-danger">*</span></label>
                                <input type="number" step="0.1" class="form-control" name="peso" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Cinturón <span class="text-danger">*</span></label>
                                <select class="form-select" name="cinturon" required>
                                    <option value="" selected disabled>Grado...</option>
                                    <option th:each="cinturon : ${listaCinturones}" 
                                            th:value="${cinturon}" 
                                            th:text="${cinturon}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4 bg-light p-3 rounded border">
                            <label class="form-label fw-bold d-block mb-3">Modalidades a Participar:</label>
                            
                            <div th:if="${listaModalidades == null}" class="alert alert-warning">
                                Error cargando modalidades.
                            </div>

                            <div class="row" th:if="${listaModalidades != null}">
                                <div class="col-6 col-md-4 mb-2" th:each="mod : ${listaModalidades}">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="modalidades" th:value="${mod}" th:id="${'mod_' + mod}">
                                        <label class="form-check-label" th:for="${'mod_' + mod}" th:text="${mod}"></label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow-sm hover-effect">
                            CONFIRMAR INSCRIPCIÓN
                        </button>
                    </form>
                </div>
            </div>

            <div id="form-juez" class="card shadow-lg border-0 form-section" style="display: none;">
                <div class="card-header bg-danger text-white py-3">
                    <h5 class="mb-0"><i class="fas fa-gavel me-2"></i>Solicitud de Juez</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/inscripciones/guardar/juez}" method="post">
                        <input type="hidden" name="idCampeonato" th:value="${campeonato.id}">
                        
                        <div class="alert alert-warning">
                            <i class="fas fa-info-circle"></i> Su solicitud quedará pendiente de aprobación.
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Documento</label>
                            <input type="number" class="form-control" name="documento" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" name="nombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo</label>
                            <input type="email" class="form-control" name="correo" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">ID Federación (Opcional)</label>
                            <input type="text" class="form-control" name="certificacion">
                        </div>

                        <button type="submit" class="btn btn-danger w-100 py-3 fw-bold shadow-sm hover-effect">
                            ENVIAR SOLICITUD
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/inscripciones.js}"></script>

</body>
</html>
