<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <head th:replace="~{fragments/global :: head(titulo='Inscripción al Campeonato', archivoCss='/css/dashboard.css')}"></head>
    <link rel="stylesheet" th:href="@{/css/wizard.css}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <a th:href="@{/inicio}" style="text-decoration: none; display: flex; align-items: center; gap: 15px;">
                <img th:src="@{/imgs/logo2.png}" alt="DidaMartials Logo" class="nav-logo">
                <span class="brand-text">DidaMartials</span>
            </a>
        </div>
        <div class="nav-user">
            <a th:href="@{/inicio}" class="btn-logout" title="Salir"><i class="fas fa-arrow-left"></i> Volver</a>
        </div>
    </nav>

    <div class="dashboard-container" style="max-width: 800px; margin: 0 auto;">
        
        <div class="wizard-header">
            <h2 th:text="${campeonato.nombre}">Nombre del Campeonato</h2>
            <p style="color:#666; margin-top:-15px;">
                <i class="fas fa-map-marker-alt" style="color:#b71c1c;"></i> <span th:text="${campeonato.ubicacion}">Ubicación</span> &nbsp;|&nbsp; 
                <i class="fas fa-calendar" style="color:#b71c1c;"></i> <span th:text="${campeonato.fechaInicio}">Fecha</span>
            </p>
        </div>

        <form th:action="@{/guardar-inscripcion}" method="post" id="inscripcionForm" class="wizard-step active-step" style="display:block; padding: 40px;">
            
            <input type="hidden" name="idCampeonato" th:value="${campeonato.id}">
            <input type="hidden" id="jsonConfig" th:value="${campeonato.jsonModalidades}">

            <h3 class="step-title">Datos del Competidor</h3>

            <div class="form-grid">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" name="nombreCompetidor" class="input-with-label" required placeholder="Tu nombre">
                </div>
                <div class="form-group">
                    <label>Club / Academia</label>
                    <input type="text" name="club" class="input-with-label" required placeholder="Ej: Dojo Cobra Kai">
                </div>
            </div>

            <hr style="border:0; border-top:1px dashed #ddd; margin: 30px 0;">

            <h3 class="step-title">Selección de Categoría</h3>
            <p class="step-desc">Selecciona la modalidad y el sistema te mostrará las categorías disponibles.</p>

            <div class="form-group full-width">
                <label style="font-weight:bold; color:#b71c1c; margin-bottom:5px; display:block;">1. Selecciona la Modalidad</label>
                <select id="selectModalidad" name="modalidadId" class="text-select" style="width:100%; font-size:1.1rem;" required>
                    <option value="">-- Elige una opción --</option>
                    </select>
            </div>

            <div id="dynamic-fields-container" style="margin-top: 20px;">
                </div>

            <div class="wizard-footer" style="justify-content: center;">
                <button type="submit" class="btn-submit-final" style="width: 100%; max-width: 300px;">
                    <i class="fas fa-check-circle"></i> Confirmar Inscripción
                </button>
            </div>

        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:src="@{/js/inscripcion.js}"></script>

</body>
</html>
