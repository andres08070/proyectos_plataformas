<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Inscripción para ' + ${nombreCampeonato}">Formulario de Inscripción</title>
    <style>
        /* CSS Básico para el formulario */
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #4CAF50; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <h1 th:text="'Registro de Participante para: ' + ${nombreCampeonato}">Registro para Campeonato</h1>
    <p>Asegúrate de que el participante cumpla con los requisitos del torneo.</p>

    <form th:action="@{/inscripciones/guardar}" method="POST"> 
        
        <input type="hidden" name="idCampeonato" th:value="${idCampeonato}">
        
        <div class="form-group">
            <label for="nombreParticipante">Nombre Completo del Participante:</label>
            <input type="text" id="nombreParticipante" name="nombreParticipante" required>
        </div>
        
        <div class="form-group">
            <label for="categoria">Categoría / Modalidad:</label>
            <select id="categoria" name="categoria" required>
                <option value="">Seleccione una Categoría</option>
                <option value="Combate">Combate</option>
                <option value="Figuras">Figuras (Poomsae)</option>
                <option value="DefensaPersonal">Defensa Personal</option>
            </select>
        </div>

        <button type="submit">Confirmar Inscripción</button>
        
    </form>
    
    <p style="margin-top: 20px;"><a th:href="@{/campeonatos/lista}">← Volver a la lista de campeonatos</a></p>

</body>
</html>
