<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Campeonatos</title>
</head>
<body>

    <h1>🏆 Campeonatos Creados</h1>

    <div th:if="${listaCampeonatos.isEmpty()}">
        <p>No hay campeonatos disponibles.</p>
    </div>

    <div th:each="camp : ${listaCampeonatos}" class="action-card" style="margin-bottom: 20px; padding: 20px; border: 1px solid #ddd; border-radius: 10px;">

        <h3 th:text="${camp.nombre}">Nombre del Campeonato</h3>

        <p>
            <i class="fas fa-calendar-alt"></i> 
            <strong>Fecha:</strong> <span th:text="${camp.fechaInicio}"></span>
        </p>

        <p>
            <i class="fas fa-map-marker-alt"></i> 
            <strong>Ubicación:</strong> <span th:text="${camp.ubicacion}"></span>
        </p>

        <a th:href="@{/campeonatos/formulario(id=${camp.id})}" class="btn-action">
            Inscribir Participantes
        </a>
    </div>
</body>
</html>
