<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <head th:replace="~{fragments/global :: head(titulo='Crear Campeonato', archivoCss='/css/dashboard.css')}"></head>
    <link rel="stylesheet" th:href="@{/css/wizard.css}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/airbnb.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <a th:href="@{/inicio}" style="text-decoration: none; display: flex; align-items: center; gap: 15px;">
                <img th:src="@{/imgs/logo2.png}" alt="DidaMartials Logo" class="nav-logo">
                <span class="brand-text">DidaMartials</span>
            </a>
        </div>
        <div class="nav-user">
            <a th:href="@{/inicio}" class="btn-logout" title="Cancelar"><i class="fas fa-times"></i></a>
        </div>
    </nav>

    <div class="dashboard-container">
        
        <div class="wizard-header">
            <h2>Nuevo Campeonato</h2>
            <div class="progress-container">
                <div class="step active" id="indicator-1"><div class="step-circle">1</div><span class="step-label">General</span></div>
                <div class="step" id="indicator-2"><div class="step-circle">2</div><span class="step-label">Modalidades</span></div>
                <div class="step" id="indicator-3"><div class="step-circle">3</div><span class="step-label">Logística</span></div>
                <div class="step" id="indicator-4"><div class="step-circle">4</div><span class="step-label">Resumen</span></div>
                <div class="progress-line"></div>
            </div>
        </div>

        <form th:action="@{/guardar-campeonato}" method="post" class="wizard-form" id="campeonatoForm">
            
            <div class="wizard-step active-step" id="step-1">
                <h3 class="step-title">Información Básica</h3>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>Nombre del Campeonato *</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej: Copa Regional Dida 2025" required>
                    </div>
                    <div class="form-group">
                        <label>Fecha de Inicio *</label>
                        <div class="date-input-wrapper">
                            <input type="text" id="fechaInicio" name="fechaInicio" class="flatpickr-input" placeholder="Seleccionar fecha" required>
                            <i class="fas fa-calendar-alt date-icon"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Fecha Fin *</label>
                        <div class="date-input-wrapper">
                            <input type="text" id="fechaFin" name="fechaFin" class="flatpickr-input" placeholder="Seleccionar fecha" required>
                            <i class="fas fa-calendar-alt date-icon"></i>
                        </div>
                    </div>
                    <div class="form-group full-width">
                        <label>Ubicación / Sede *</label>
                        <input type="text" id="ubicacion" name="ubicacion" placeholder="Ej: Coliseo Mayor, Bogotá" required>
                    </div>
                </div>
                <div class="wizard-footer">
                    <button type="button" class="btn-nav btn-next" onclick="nextStep(2)">Siguiente &rarr;</button>
                </div>
            </div>

            <div class="wizard-step" id="step-2">
                <h3 class="step-title">Configuración de Modalidades</h3>
                <p class="step-desc">Agrega las disciplinas de tu torneo y configura sus categorías.</p>

                <div id="modalities-container-dynamic"></div>

                <button type="button" class="btn-add-modality" onclick="addNewModality()">
                    <i class="fas fa-plus-circle"></i> Agregar Nueva Modalidad
                </button>

                <div class="wizard-footer">
                    <button type="button" class="btn-nav btn-prev" onclick="prevStep(1)">&larr; Atrás</button>
                    <button type="button" class="btn-nav btn-next" onclick="nextStep(3)">Siguiente &rarr;</button>
                </div>
            </div>

            <div class="wizard-step" id="step-3">
                <h3 class="step-title">Logística</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Número de Áreas (Tatamis) *</label>
                        <p class="step-desc" style="font-size:0.8rem; margin-bottom:5px;">Máximo 12 áreas.</p>
                        
                        <input type="number" id="numAreas" name="numAreas" value="1" min="1" max="12" required 
                               onkeydown="blockInvalidChars(event)"
                               oninput="if(this.value > 12) this.value = 12; if(this.value < 1) this.value = 1;">
                    </div>
                </div>
                <div class="wizard-footer">
                    <button type="button" class="btn-nav btn-prev" onclick="prevStep(2)">&larr; Atrás</button>
                    <button type="button" class="btn-nav btn-next" onclick="nextStep(4)">Resumen &rarr;</button>
                </div>
            </div>

            <div class="wizard-step" id="step-4">
                <h3 class="step-title">Resumen del Evento</h3>
                <div id="summary-content" class="summary-box"></div>
                <div class="wizard-footer">
                    <button type="button" class="btn-nav btn-prev" onclick="prevStep(3)">&larr; Atrás</button>
                    <button type="submit" class="btn-submit-final">Confirmar y Crear</button>
                </div>
            </div>

        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>
    
    <script th:src="@{/js/wizard.js}"></script>
</body>
</html>
