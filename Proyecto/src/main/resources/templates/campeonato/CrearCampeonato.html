<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <head th:replace="~{fragments/global :: head(titulo='Crear Campeonato', archivoCss='/css/dashboard.css')}"></head>
    <link rel="stylesheet" th:href="@{/css/wizard.css}">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <a th:href="@{/inicio}" style="text-decoration: none; display: flex; align-items: center; gap: 15px;">
                <img th:src="@{/imgs/logo2.png}" alt="DidaMartials Logo" class="nav-logo">
                <span class="brand-text">DidaMartials</span>
            </a>
        </div>
        <div class="nav-user">
            <a th:href="@{/inicio}" class="btn-logout" title="Cancelar y volver al Dashboard">
                <i class="fas fa-times"></i>
            </a>
        </div>
    </nav>

    <div class="dashboard-container">
        
        <div class="wizard-header">
            <h2>Nuevo Campeonato</h2>
            <div class="progress-container">
                <div class="step active" id="indicator-1"><div class="step-circle">1</div><span class="step-label">General</span></div>
                <div class="step" id="indicator-2"><div class="step-circle">2</div><span class="step-label">Modalidades</span></div>
                <div class="step" id="indicator-3"><div class="step-circle">3</div><span class="step-label">Logística</span></div>
                <div class="step" id="indicator-4"><div class="step-circle">4</div><span class="step-label">Resumen</span></div>
                <div class="progress-line"></div>
            </div>
        </div>

        <form th:action="@{/guardar-campeonato}" method="post" class="wizard-form" id="campeonatoForm">
            
            <div class="wizard-step active-step" id="step-1">
                <h3 class="step-title">Información Básica</h3>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label>Nombre del Campeonato *</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Ej: Copa Regional Dida 2025" required>
                    </div>
                    <div class="form-group">
                        <label>Fecha de Inicio *</label>
                        <input type="date" id="fechaInicio" name="fechaInicio" required>
                    </div>
                    <div class="form-group">
                        <label>Fecha Fin *</label>
                        <input type="date" id="fechaFin" name="fechaFin" required>
                    </div>
                    <div class="form-group full-width">
                        <label>Ubicación / Sede *</label>
                        <input type="text" id="ubicacion" name="ubicacion" placeholder="Ej: Coliseo Mayor, Bogotá" required>
                    </div>
                </div>
                <div class="wizard-footer">
                    <button type="button" class="btn-nav btn-next" onclick="nextStep(2)">Siguiente &rarr;</button>
                </div>
            </div>

            <div class="wizard-step" id="step-2">
                <h3 class="step-title">Configuración de Categorías</h3>
                <p class="step-desc">Activa los criterios de división para cada modalidad seleccionada.</p>

                <div class="modalities-container">

                    <label class="modality-card">
                        <input type="checkbox" name="modalidades" value="COMBATE" class="modality-trigger">
                        <div class="card-header-content">
                            <div class="icon-box icon-red"><i class="fas fa-fist-raised"></i></div>
                            <div class="text-box"><h4>Combate</h4><p>Kumite / Sparring</p></div>
                            <div class="check-indicator"><i class="fas fa-check-circle"></i></div>
                        </div>
                        <div class="config-panel">
                            <div class="separator"></div>
                            
                            <div class="criteria-wrapper">
                                <div class="criteria-header">
                                    <span>Dividir por Peso</span>
                                    <label class="switch"><input type="checkbox" class="toggle-control"><span class="slider round"></span></label>
                                </div>
                                <div class="criteria-body">
                                    <div class="input-adder">
                                        <input type="text" id="input-combate-peso" placeholder="Ej: -60kg">
                                        <button type="button" onclick="addItem('combate', 'peso')"><i class="fas fa-plus"></i></button>
                                    </div>
                                    <div class="tags-container" id="list-combate-peso"></div>
                                    <input type="hidden" name="combate_pesos_data" id="hidden-combate-peso">
                                </div>
                            </div>

                            <div class="criteria-wrapper">
                                <div class="criteria-header">
                                    <span>Dividir por Cinturón</span>
                                    <label class="switch"><input type="checkbox" class="toggle-control"><span class="slider round"></span></label>
                                </div>
                                <div class="criteria-body">
                                    <div class="input-adder">
                                        <input type="text" id="input-combate-rango" placeholder="Ej: Principiantes">
                                        <button type="button" onclick="addItem('combate', 'rango')"><i class="fas fa-plus"></i></button>
                                    </div>
                                    <div class="tags-container" id="list-combate-rango"></div>
                                    <input type="hidden" name="combate_rangos_data" id="hidden-combate-rango">
                                </div>
                            </div>

                            <div class="criteria-wrapper">
                                <div class="criteria-header">
                                    <span>Dividir por Edad</span>
                                    <label class="switch"><input type="checkbox" class="toggle-control"><span class="slider round"></span></label>
                                </div>
                                <div class="criteria-body">
                                    <div class="input-adder">
                                        <input type="text" id="input-combate-edad" placeholder="Ej: 14-15 años">
                                        <button type="button" onclick="addItem('combate', 'edad')"><i class="fas fa-plus"></i></button>
                                    </div>
                                    <div class="tags-container" id="list-combate-edad"></div>
                                    <input type="hidden" name="combate_edades_data" id="hidden-combate-edad">
                                </div>
                            </div>

                            <div class="criteria-wrapper">
                                <div class="criteria-header">
                                    <span>Dividir por Género</span>
                                    <label class="switch"><input type="checkbox" class="toggle-control" onchange="toggleGender('combate', this)"><span class="slider round"></span></label>
                                </div>
                                <div class="criteria-body">
                                    <p class="small-desc">Selecciona el formato de la categoría:</p>
                                    <select id="select-combate-genero" class="gender-select" name="combate_genero_data">
                                        <option value="Separado">Masculino y Femenino (Separados)</option>
                                        <option value="Mixto">Mixto (Compiten juntos)</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </label>

                    <label class="modality-card">
                        <input type="checkbox" name="modalidades" value="FIGURAS" class="modality-trigger">
                        <div class="card-header-content">
                            <div class="icon-box icon-purple"><i class="fas fa-theater-masks"></i></div>
                            <div class="text-box"><h4>Figuras</h4><p>Katas / Formas</p></div>
                            <div class="check-indicator"><i class="fas fa-check-circle"></i></div>
                        </div>
                        <div class="config-panel">
                            <div class="separator"></div>
                            <div class="criteria-wrapper">
                                <div class="criteria-header"><span>Dividir por Peso</span><label class="switch"><input type="checkbox" class="toggle-control"><span class="slider round"></span></label></div>
                                <div class="criteria-body">
                                    <div class="input-adder"><input type="text" id="input-figuras-peso"><button type="button" onclick="addItem('figuras', 'peso')"><i class="fas fa-plus"></i></button></div>
                                    <div class="tags-container" id="list-figuras-peso"></div><input type="hidden" name="figuras_pesos_data" id="hidden-figuras-peso">
                                </div>
                            </div>
                            <div class="criteria-wrapper">
                                <div class="criteria-header"><span>Dividir por Cinturón</span><label class="switch"><input type="checkbox" class="toggle-control"><span class="slider round"></span></label></div>
                                <div class="criteria-body">
                                    <div class="input-adder"><input type="text" id="input-figuras-rango"><button type="button" onclick="addItem('figuras', 'rango')"><i class="fas fa-plus"></i></button></div>
                                    <div class="tags-container" id="list-figuras-rango"></div><input type="hidden" name="figuras_rangos_data" id="hidden-figuras-rango">
                                </div>
                            </div>
                            <div class="criteria-wrapper">
                                <div class="criteria-header"><span>Dividir por Edad</span><label class="switch"><input type="checkbox" class="toggle-control"><span class="slider round"></span></label></div>
                                <div class="criteria-body">
                                    <div class="input-adder"><input type="text" id="input-figuras-edad"><button type="button" onclick="addItem('figuras', 'edad')"><i class="fas fa-plus"></i></button></div>
                                    <div class="tags-container" id="list-figuras-edad"></div><input type="hidden" name="figuras_edades_data" id="hidden-figuras-edad">
                                </div>
                            </div>
                            <div class="criteria-wrapper">
                                <div class="criteria-header"><span>Dividir por Género</span><label class="switch"><input type="checkbox" class="toggle-control" onchange="toggleGender('figuras', this)"><span class="slider round"></span></label></div>
                                <div class="criteria-body">
                                    <select id="select-figuras-genero" class="gender-select" name="figuras_genero_data">
                                        <option value="Separado">Masculino y Femenino</option><option value="Mixto">Mixto</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </label>

                    <label class="modality-card">
                        <input type="checkbox" name="modalidades" value="DEFENSA" class="modality-trigger">
                        <div class="card-header-content">
                            <div class="icon-box icon-green" style="background: #e8f5e9; color: #2e7d32;"><i class="fas fa-user-shield"></i></div>
                            <div class="text-box"><h4>Defensa Personal</h4><p>Técnica aplicada</p></div>
                            <div class="check-indicator"><i class="fas fa-check-circle"></i></div>
                        </div>
                        <div class="config-panel">
                            <div class="separator"></div>
                            <div class="criteria-wrapper">
                                <div class="criteria-header"><span>Dividir por Peso</span><label class="switch"><input type="checkbox" class="toggle-control"><span class="slider round"></span></label></div>
                                <div class="criteria-body">
                                    <div class="input-adder"><input type="text" id="input-defensa-peso"><button type="button" onclick="addItem('defensa', 'peso')"><i class="fas fa-plus"></i></button></div>
                                    <div class="tags-container" id="list-defensa-peso"></div><input type="hidden" name="defensa_pesos_data" id="hidden-defensa-peso">
                                </div>
                            </div>
                            <div class="criteria-wrapper">
                                <div class="criteria-header"><span>Dividir por Cinturón</span><label class="switch"><input type="checkbox" class="toggle-control"><span class="slider round"></span></label></div>
                                <div class="criteria-body">
                                    <div class="input-adder"><input type="text" id="input-defensa-rango"><button type="button" onclick="addItem('defensa', 'rango')"><i class="fas fa-plus"></i></button></div>
                                    <div class="tags-container" id="list-defensa-rango"></div><input type="hidden" name="defensa_rangos_data" id="hidden-defensa-rango">
                                </div>
                            </div>
                            <div class="criteria-wrapper">
                                <div class="criteria-header"><span>Dividir por Edad</span><label class="switch"><input type="checkbox" class="toggle-control"><span class="slider round"></span></label></div>
                                <div class="criteria-body">
                                    <div class="input-adder"><input type="text" id="input-defensa-edad"><button type="button" onclick="addItem('defensa', 'edad')"><i class="fas fa-plus"></i></button></div>
                                    <div class="tags-container" id="list-defensa-edad"></div><input type="hidden" name="defensa_edades_data" id="hidden-defensa-edad">
                                </div>
                            </div>
                             <div class="criteria-wrapper">
                                <div class="criteria-header"><span>Dividir por Género</span><label class="switch"><input type="checkbox" class="toggle-control" onchange="toggleGender('defensa', this)"><span class="slider round"></span></label></div>
                                <div class="criteria-body">
                                    <select id="select-defensa-genero" class="gender-select" name="defensa_genero_data">
                                        <option value="Separado">Masculino y Femenino</option><option value="Mixto">Mixto</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </label>

                    <label class="modality-card">
                        <input type="checkbox" name="modalidades" value="DEMO" class="modality-trigger">
                        <div class="card-header-content">
                            <div class="icon-box icon-yellow" style="background: #fffde7; color: #fbc02d;"><i class="fas fa-star"></i></div>
                            <div class="text-box"><h4>Exhibiciones</h4><p>Shows</p></div>
                            <div class="check-indicator"><i class="fas fa-check-circle"></i></div>
                        </div>
                        <div class="config-panel">
                            <div class="separator"></div>
                            <div class="criteria-wrapper">
                                <div class="criteria-header"><span>Dividir por Peso</span><label class="switch"><input type="checkbox" class="toggle-control"><span class="slider round"></span></label></div>
                                <div class="criteria-body">
                                    <div class="input-adder"><input type="text" id="input-demo-peso"><button type="button" onclick="addItem('demo', 'peso')"><i class="fas fa-plus"></i></button></div>
                                    <div class="tags-container" id="list-demo-peso"></div><input type="hidden" name="demo_pesos_data" id="hidden-demo-peso">
                                </div>
                            </div>
                            <div class="criteria-wrapper">
                                <div class="criteria-header"><span>Dividir por Cinturón</span><label class="switch"><input type="checkbox" class="toggle-control"><span class="slider round"></span></label></div>
                                <div class="criteria-body">
                                    <div class="input-adder"><input type="text" id="input-demo-rango"><button type="button" onclick="addItem('demo', 'rango')"><i class="fas fa-plus"></i></button></div>
                                    <div class="tags-container" id="list-demo-rango"></div><input type="hidden" name="demo_rangos_data" id="hidden-demo-rango">
                                </div>
                            </div>
                            <div class="criteria-wrapper">
                                <div class="criteria-header"><span>Dividir por Edad</span><label class="switch"><input type="checkbox" class="toggle-control"><span class="slider round"></span></label></div>
                                <div class="criteria-body">
                                    <div class="input-adder"><input type="text" id="input-demo-edad"><button type="button" onclick="addItem('demo', 'edad')"><i class="fas fa-plus"></i></button></div>
                                    <div class="tags-container" id="list-demo-edad"></div><input type="hidden" name="demo_edades_data" id="hidden-demo-edad">
                                </div>
                            </div>
                             <div class="criteria-wrapper">
                                <div class="criteria-header"><span>Dividir por Género</span><label class="switch"><input type="checkbox" class="toggle-control" onchange="toggleGender('demo', this)"><span class="slider round"></span></label></div>
                                <div class="criteria-body">
                                    <select id="select-demo-genero" class="gender-select" name="demo_genero_data">
                                        <option value="Separado">Masculino y Femenino</option><option value="Mixto">Mixto</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </label>

                </div>

                <div class="wizard-footer">
                    <button type="button" class="btn-nav btn-prev" onclick="prevStep(1)">&larr; Atrás</button>
                    <button type="button" class="btn-nav btn-next" onclick="nextStep(3)">Siguiente &rarr;</button>
                </div>
            </div>

            <div class="wizard-step" id="step-3">
                <h3 class="step-title">Logística</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Número de Áreas (Tatamis) *</label>
                        <p class="small-desc" style="margin-top:-5px; margin-bottom:10px;">Máximo 12 áreas permitidas.</p>
                        <input type="number" id="numAreas" name="numAreas" value="1" min="1" max="12" required 
                               oninput="if(this.value > 12) this.value = 12; if(this.value < 1) this.value = 1;">
                    </div>
                </div>
                <div class="wizard-footer">
                    <button type="button" class="btn-nav btn-prev" onclick="prevStep(2)">&larr; Atrás</button>
                    <button type="button" class="btn-nav btn-next" onclick="nextStep(4)">Resumen &rarr;</button>
                </div>
            </div>

            <div class="wizard-step" id="step-4">
                <h3 class="step-title">Resumen del Evento</h3>
                <div id="summary-content" class="summary-box"></div>
                <div class="wizard-footer">
                    <button type="button" class="btn-nav btn-prev" onclick="prevStep(3)">&larr; Atrás</button>
                    <button type="submit" class="btn-submit-final">Confirmar y Crear</button>
                </div>
            </div>

        </form>
    </div>
    
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
