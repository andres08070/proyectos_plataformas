<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
</head>
<body>

    <h2>Registro</h2>

    <form action="/registrar" method="post">
        <label>Numero de documento:</label><br>
        <input type="text" name="Numero de documento" required><br><br>
        
        <label>Nombre completo:</label><br>
        <input type="text" name="nombre" required><br><br>
        
        <label>Edad:</label><br>
        <input type="text" name="edad" required><br><br>
        
        <label>Sexo:</label><br>
        <input type="text" name="sexo" required><br><br>
        
        <label>Nacionalidad:</label><br>
        <input type="text" name="nacionalidad" required><br><br>
        
        <label>Correo:</label><br>
        <input type="email" name="correo" required><br><br>
        
        <label>Contraseña:</label><br>
        <input type="text" name="contraseña" required><br><br>
        
        <label>Confirmar contraseña:</label><br>
        <input type="text" name="Confirmar" required><br><br>
        <button type="submit">Registrar</button>

    </form>

</body>
</html>
