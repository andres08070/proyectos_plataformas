<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Didamartials - Registro</title>
    
    <link rel="icon" type="image/x-icon" th:href="@{/imgs/logoicon.ico}">
    
    <link rel="stylesheet" th:href="@{/styles.css}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <a th:href="@{/}" title="Volver al inicio" style="position: absolute; left: 20px; color: #555;">
                <i class="fas fa-arrow-left fa-2x"></i>
            </a>

            <a th:href="@{/}" title="Ir a la página principal">
                <img th:src="@{/imgs/logo2.png}" alt="Logo Didamartials" class="logo-img">
            </a>

            <h2>Registro de Usuario</h2>
        </header>

        <form action="/registrar" method="post" id="formularioRegistro">
            
            <div class="form-group">
                <label>Número de documento:</label>
                <input type="number" 
                       name="NumeroDocumento" 
                       id="docInput"
                       required 
                       oninput="if(this.value.length > 15) this.value = this.value.slice(0, 15);"
                       placeholder="Ej: 1090..."
                       title="Debe contener entre 6 y 15 números.">
                <small id="docError" style="color: #e74c3c; display: none; margin-top: 5px;">Mínimo 6 dígitos requeridos</small>
            </div>
            
            <div class="form-group">
                <label>Nombre completo:</label>
                <input type="text" name="nombre" required placeholder="Tu nombre">
            </div>
            
            <div class="form-group">
                <label>Sexo:</label>
                <div class="custom-dropdown">
                     <select name="sexo" required>
                        <option value="" disabled selected> Seleccione el sexo </option>
                        <option value="Femenino">Femenino</option>
                        <option value="Masculino">Masculino</option>
                    </select>
                    <div class="dropdown-selected">
                        <span> Seleccione el sexo </span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <ul class="dropdown-options"></ul>
                </div>
            </div>

            <div class="form-group">
                <label>Nacionalidad:</label>
                <div class="custom-dropdown">
                    <select name="Nacionalidad" required>
                        <option value="" disabled selected> Seleccione una nacionalidad </option>
                        <option value="alemania">Alemania</option>
                        <option value="argentina">Argentina</option>
                        <option value="bolivia">Bolivia</option>
                        <option value="brasil">Brasil</option>
                        <option value="canada">Canadá</option>
                        <option value="chile">Chile</option>
                        <option value="colombia">Colombia</option>
                        <option value="costa_rica">Costa Rica</option>
                        <option value="cuba">Cuba</option>
                        <option value="ecuador">Ecuador</option>
                        <option value="el_salvador">El Salvador</option>
                        <option value="espana">España</option>
                        <option value="estados_unidos">Estados Unidos</option>
                        <option value="francia">Francia</option>
                        <option value="guatemala">Guatemala</option>
                        <option value="guyana">Guyana</option>
                        <option value="haiti">Haití</option>
                        <option value="honduras">Honduras</option>
                        <option value="italia">Italia</option>
                        <option value="mexico">México</option>
                        <option value="nicaragua">Nicaragua</option>
                        <option value="panama">Panamá</option>
                        <option value="paraguay">Paraguay</option>
                        <option value="peru">Perú</option>
                        <option value="puerto_rico">Puerto Rico</option>
                        <option value="republica_dominicana">República Dominicana</option>
                        <option value="surinam">Surinam</option>
                        <option value="uruguay">Uruguay</option>
                        <option value="venezuela">Venezuela</option>
                        <option value="otro">Otro</option>
                    </select>
                    <div class="dropdown-selected">
                        <span> Seleccione una nacionalidad </span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <ul class="dropdown-options"></ul>
                </div>
            </div>

            <div class="form-group">
                <label>Correo:</label>
                <input type="email" name="correo" required placeholder="tucorreo@email.com">
            </div>
            
            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" 
                       id="password"
                       name="contraseña" 
                       required 
                       minlength="8"
                       pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{8,}"
                       title="Mínimo 8 caracteres, una mayúscula, una minúscula, un número y un símbolo."
                       placeholder="Mínimo 8 caracteres..."
                       onkeyup="validarContrasenas()">
            </div>
            
            <div class="form-group">
                <label>Confirmar Contraseña:</label>
                <input type="password" 
                       id="confirm_password" 
                       name="Confirmar" 
                       required
                       placeholder="Repite tu contraseña"
                       onkeyup="validarContrasenas()">
                <small id="mensajeError" style="color: #e74c3c; display: none; margin-top: 5px;">Las contraseñas no coinciden</small>
            </div>

            <button type="submit" class="btn-submit" id="botonRegistrar">Registrar</button>
            
            <div style="text-align: center; margin-top: 15px;">
                <p>¿Ya tienes una cuenta? 
                    <a th:href="@{/login}" style="color: #e74c3c; text-decoration: none; font-weight: bold;">Inicia sesión aquí</a>
                </p>
            </div>

        </form>
        
        <p th:text="${msg}" style="color: #e74c3c; margin-top: 10px;"></p>
    </div>

    <script th:src="@{/script.js}"></script>
</body>
</html>
