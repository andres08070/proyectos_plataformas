<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
</head>
<body>

    <h2>Registro</h2>

    <form action="/registrar" method="post">
        <label>Numero de documento:</label><br>
        <input type="number" name="NumeroDocumento" required><br><br>
        
        <label>Nombre completo:</label><br>
        <input type="text" name="nombre" required><br><br>
        
        <label for="frutas">Sexo:</label><br>
        <select name="sexo" required>
            <option value="" disabled selected>-- Seleccione el sexo--</option>
            <option value="Femenino">Femenino</option>
        </select><br><br>

        <label>Nacionalidad:</label><br>
        <select name="Nacionalidad" required>
            <option value="" disabled selected>-- Seleccione una nacionalidad --</option>
            <option value="argentina">Argentina</option>
            <option value="bolivia">Bolivia</option>
            <option value="brasil">Brasil</option>
            <option value="chile">Chile</option>
            <option value="colombia">Colombia</option>
            <option value="ecuador">Ecuador</option>
            <option value="guyana">Guyana</option>
            <option value="paraguay">Paraguay</option>
            <option value="peru">Perú</option>
            <option value="surinam">Surinam</option>
            <option value="uruguay">Uruguay</option>
            <option value="venezuela">Venezuela</option>
            <option value="belice">Belice</option>
            <option value="costa_rica">Costa Rica</option>
            <option value="el_salvador">El Salvador</option>
            <option value="guatemala">Guatemala</option>
            <option value="honduras">Honduras</option>
            <option value="nicaragua">Nicaragua</option>
            <option value="panama">Panamá</option>
            <option value="cuba">Cuba</option>
            <option value="republica_dominicana">República Dominicana</option>
            <option value="haiti">Haití</option>
            <option value="puerto_rico">Puerto Rico</option>
        </select>
        <br><br>


        
        <label>Correo:</label><br>
        <input type="email" name="correo" required><br><br>
        
       <label>Contraseña:</label><br>
        <input type="password" 
               name="contraseña" 
               required
               minlength="8"
               pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[@$!%*?&.,;:])[A-Za-z\\d@$!%*?&.,;:]{8,}$"
               title="Debe tener mínimo 8 caracteres, una mayúscula, una minúscula, un número y un símbolo.">
        <br><br>
        
        <label>Confirmar Contraseña:</label><br>
        <input type="password" 
               name="Confirmar" 
               required
               minlength="8"
               pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[@$!%*?&.,;:])[A-Za-z\\d@$!%*?&.,;:]{8,}$"
               title="Debe tener mínimo 8 caracteres, una mayúscula, una minúscula, un número y un símbolo."><br><br>
        <button type="submit">Registrar</button>

    </form>
    <p th:text="${msg}"></p>
</body>
</html>
