<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Verificar Palíndromo</title>
</head>
<body>
    <h1>Verificador de Palíndromos</h1>
    <form action="/palindromo" method="post">
        <label for="palabra">Ingresa una palabra:</label><br><br>
        <input type="text" id="palabra" name="palabra" required>
        <button type="submit">Verificar</button>
    </form>
</body>
</html>
